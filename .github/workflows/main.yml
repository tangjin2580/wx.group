name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: android-sdk-api35-${{ runner.os }}-v1

      - name: Install Android SDK (api35 + build-tools 35.0.0)
        # runner 自带的 cmdline-tools 版本偏旧，改用最新 commandline-tools 安装 api35 平台。
        # SDK 根固定在 ~/android-sdk 并整体缓存，首次下载后后续 run 直接复用。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          LOG="$(mktemp)"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ -x "$SDKMANAGER" ]; then
            echo "SDK present (cache hit); verifying packages..." | tee -a "$LOG"
          else
            echo "SDK not cached; downloading latest commandline-tools..." | tee -a "$LOG"
            curl -sSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" >>"$LOG" 2>&1
            if [ ! -s /tmp/cmdtools.zip ]; then
              echo "commandline-tools download produced empty file" | tee -a "$LOG"
            else
              unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools" >>"$LOG" 2>&1
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null
            fi
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager still missing after setup" | tee -a "$LOG"
            RC=1
          else
            "$SDKMANAGER" --version 2>&1 | head -2 | tee -a "$LOG" || true
            yes | "$SDKMANAGER" --licenses >>"$LOG" 2>&1 || true
            yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >>"$LOG" 2>&1
            RC=$?
          fi

          echo "FINAL sdkmanager rc=$RC"
          tail -40 "$LOG"
          if [ "$RC" -ne 0 ]; then
            BODY="$(tail -c 6000 "$LOG")"
            {
              echo "SDK INSTALL FAILED (run ${GITHUB_RUN_ID:-?}) rc=$RC"
              echo
              echo "----- full diagnostic log (tail) -----"
              echo "$BODY"
            } | jq -Rs '{body: .}' > /tmp/payload.json
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              --data @/tmp/payload.json | head -c 400
            echo "::error::SDK install failed rc=$RC; see commit comment on $GITHUB_SHA"
            exit 1
          fi
          echo "::notice::Android SDK (api35 + build-tools 35.0.0) ready at $ANDROID_HOME"
          exit 0

      - name: Decode signing key (mrli-key.jks)
        # 仅在仓库配置了 Secrets 时才签名，否则出未签名包（构建不阻塞）。
        # 需要 4 个 Secret：MRLI_KEY_JKS_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
        # 注意：step 级 if 不能使用 secrets 上下文（GitHub 限制），故把判断放到脚本里。
        env:
          MRLI_KEY_JKS_BASE64: ${{ secrets.MRLI_KEY_JKS_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$MRLI_KEY_JKS_BASE64" ]; then
            echo "$MRLI_KEY_JKS_BASE64" | base64 -d > app/mrli-key.jks
            {
              echo "KEYSTORE_FILE=${{ github.workspace }}/app/mrli-key.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing key decoded; release APK will be signed."
          else
            echo "MRLI_KEY_JKS_BASE64 not set; building unsigned APK."
          fi

      - name: Build Debug APK
        # 失败时把日志尾部贴到 commit comment（job logs API 匿名拉不到，便于远程排查）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./gradlew assembleDebug 2>&1 | tee /tmp/build.log
          RC=${PIPESTATUS[0]}
          if [ $RC -ne 0 ]; then
            # job logs API 匿名拉不到、commit comment 需要写权限 —— 用 ::error:: 行
            # 变成 check-run annotations（公开可读），把日志尾部带出来
            tail -40 /tmp/build.log | head -c 3800 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $RC

      - name: Build Release APK (signed if key present)
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: apks

      # 正式签名包存在则只发签名包；否则发 debug 包（未签名 release 装不上）
      - name: Pick APK to publish
        run: |
          SIGNED=$(ls apks/*-release.apk 2>/dev/null | grep -v unsigned || true)
          if [ -n "$SIGNED" ]; then
            mkdir -p publish && cp $SIGNED publish/
            echo "publishing signed release APK"
          else
            mkdir -p publish && cp apks/*-debug.apk publish/
            echo "no signing key configured; publishing debug APK"
          fi
          ls -la publish/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: publish/*.apk
          draft: false
          prerelease: false
          body: |
            ## 安装
            1. 下载 APK 安装
            2. 在 LSPosed 中激活模块，勾选作用域「微信」
            3. 强停微信后重新打开生效

  publish-signature:
    # 把仓库里的微信签名库同步到自建 WebDAV 镜像（r2pan）。
    # App 内「在线获取最新签名」的第一优先级源就是这个地址，好处是用户换微信版本后
    # 不用等新 APK 发版就能拉到新签名 —— 只要往仓库里改 JSON，CI 自动推上去。
    #
    # 凭据优先级：Secrets（R2PAN_WEBDAV_USER / R2PAN_WEBDAV_PASS）→ 内置账号。
    # 内置账号本来就以明文写在 SignatureActivity.kt 里（APK 可反编译），所以这里回落不算新增泄露；
    # 想换专用账号只改 Secrets 即可，无需改代码。
    #
    # 只跳过 PR：main 推送 / tag / 手动触发都发布。
    # 上传失败不阻塞发版（APK 内仍内置签名，App 还有 jsDelivr、GitHub raw 两级回退），
    # 但会在 run 里留 warning 注解，方便回看。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upload signature to WebDAV mirror
        env:
          R2PAN_WEBDAV_USER: ${{ secrets.R2PAN_WEBDAV_USER }}
          R2PAN_WEBDAV_PASS: ${{ secrets.R2PAN_WEBDAV_PASS }}
        run: |
          set -uo pipefail

          SRC="app/src/main/assets/wechat_signatures.json"
          BASE="https://r2pan.us.ci/webdav"
          DIR="$BASE/wxgroup"
          URL="$DIR/wechat_signatures.json"
          USER="${R2PAN_WEBDAV_USER:-webdav}"
          PASS="${R2PAN_WEBDAV_PASS:-lixin2324}"

          WXVER=$(jq -r '.wechatVersion // "?"' "$SRC")
          REV=$(jq -r '.revision // "?"' "$SRC")
          CNT=$(jq -r '.methods | length' "$SRC")
          SRC_SHA=$(sha256sum "$SRC" | awk '{print $1}')
          echo "本地签名库: wechatVersion=$WXVER revision=$REV methods=$CNT sha256=$SRC_SHA"

          # 目标目录不存在时建一下；已存在返回 405，忽略即可
          mc=$(curl -sS -o /dev/null -w '%{http_code}' -u "$USER:$PASS" -X MKCOL "$DIR") || mc=000
          echo "MKCOL $DIR -> $mc"

          ok=0
          code=000
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/put.out -w '%{http_code}' -u "$USER:$PASS" \
              -H 'Content-Type: application/json' \
              --upload-file "$SRC" "$URL") || code=000
            echo "PUT attempt $i -> $code"
            if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "204" ]; then ok=1; break; fi
            [ -s /tmp/put.out ] && head -c 300 /tmp/put.out && echo
            sleep 3
          done

          if [ "$ok" != "1" ]; then
            {
              echo "### ⚠️ 签名镜像上传失败"
              echo ""
              echo "- HTTP: \`$code\`"
              echo "- 影响：仅「在线获取最新签名」的首选源可能仍是旧版本；APK 内已内置 \`$WXVER\`，App 还有 jsDelivr / GitHub raw 回退。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::r2pan 上传失败（HTTP $code），已在总结里记录；不影响 APK 发版"
            exit 0
          fi

          # 回读校验，确保镜像与仓库字节一致
          curl -sS -u "$USER:$PASS" "$URL" -o /tmp/dl.json || true
          DL_SHA=$(sha256sum /tmp/dl.json 2>/dev/null | awk '{print $1}')
          if [ "$DL_SHA" = "$SRC_SHA" ]; then
            VERDICT="✅ 回读校验通过，字节一致"
          else
            VERDICT="⚠️ 回读哈希不一致（远端可能被 CDN/缓存拦截）"
            echo "::warning::回读哈希不一致 src=$SRC_SHA dl=$DL_SHA"
          fi

          {
            echo "### 微信签名已同步到 r2pan"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 微信版本 | \`$WXVER\` |"
            echo "| revision | \`$REV\` |"
            echo "| 方法数 | \`$CNT\` |"
            echo "| sha256 | \`$SRC_SHA\` |"
            echo "| 地址 | $URL |"
            echo "| 校验 | $VERDICT |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::签名镜像已更新 $URL ($WXVER rev$REV)"
