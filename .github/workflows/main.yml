name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: android-sdk-api37-${{ runner.os }}-v1

      - name: Install Android SDK (api37 + build-tools 36.0.0)
        # runner 自带的 cmdline-tools/16.0 解析不了 android-37，改用最新 commandline-tools。
        # SDK 根固定在 ~/android-sdk 并整体缓存，首次下载后后续 run 直接复用。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          LOG="$(mktemp)"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ -x "$SDKMANAGER" ]; then
            echo "SDK present (cache hit); verifying packages..." | tee -a "$LOG"
          else
            echo "SDK not cached; downloading latest commandline-tools..." | tee -a "$LOG"
            curl -sSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" >>"$LOG" 2>&1
            if [ ! -s /tmp/cmdtools.zip ]; then
              echo "commandline-tools download produced empty file" | tee -a "$LOG"
            else
              unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools" >>"$LOG" 2>&1
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null
            fi
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager still missing after setup" | tee -a "$LOG"
            RC=1
          else
            "$SDKMANAGER" --version 2>&1 | head -2 | tee -a "$LOG" || true
            yes | "$SDKMANAGER" --licenses >>"$LOG" 2>&1 || true
            yes | "$SDKMANAGER" "platforms;android-37.2" "build-tools;36.0.0" "platform-tools" >>"$LOG" 2>&1
            RC=$?
          fi

          echo "FINAL sdkmanager rc=$RC"
          tail -40 "$LOG"
          if [ "$RC" -ne 0 ]; then
            BODY="$(tail -c 6000 "$LOG")"
            {
              echo "SDK INSTALL FAILED (run ${GITHUB_RUN_ID:-?}) rc=$RC"
              echo
              echo "----- full diagnostic log (tail) -----"
              echo "$BODY"
            } | jq -Rs '{body: .}' > /tmp/payload.json
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              --data @/tmp/payload.json | head -c 400
            echo "::error::SDK install failed rc=$RC; see commit comment on $GITHUB_SHA"
            exit 1
          fi
          echo "::notice::Android SDK (api37 + build-tools 36.0.0) ready at $ANDROID_HOME"
          exit 0

      - name: Decode signing key (mrli-key.jks)
        # 仅在仓库配置了 Secrets 时才签名，否则出未签名包（构建不阻塞）。
        # 需要 4 个 Secret：MRLI_KEY_JKS_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
        # 注意：step 级 if 不能使用 secrets 上下文（GitHub 限制），故把判断放到脚本里。
        env:
          MRLI_KEY_JKS_BASE64: ${{ secrets.MRLI_KEY_JKS_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$MRLI_KEY_JKS_BASE64" ]; then
            echo "$MRLI_KEY_JKS_BASE64" | base64 -d > app/mrli-key.jks
            {
              echo "KEYSTORE_FILE=${{ github.workspace }}/app/mrli-key.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing key decoded; release APK will be signed."
          else
            echo "MRLI_KEY_JKS_BASE64 not set; building unsigned APK."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK (signed if key present)
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: apks

      # 正式签名包存在则只发签名包；否则发 debug 包（未签名 release 装不上）
      - name: Pick APK to publish
        run: |
          SIGNED=$(ls apks/*-release.apk 2>/dev/null | grep -v unsigned || true)
          if [ -n "$SIGNED" ]; then
            mkdir -p publish && cp $SIGNED publish/
            echo "publishing signed release APK"
          else
            mkdir -p publish && cp apks/*-debug.apk publish/
            echo "no signing key configured; publishing debug APK"
          fi
          ls -la publish/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: publish/*.apk
          draft: false
          prerelease: false
          body: |
            ## 安装
            1. 下载 APK 安装
            2. 在 LSPosed 中激活模块，勾选作用域「微信」
            3. 强停微信后重新打开生效
