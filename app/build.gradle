apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'io.github.wxgroup.reborn'
    compileSdk 37
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'io.github.wxgroup.reborn'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    // ── 正式签名（条件启用）──────────────────────────────────────────────
    // 仅当环境变量 KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
    // 齐备时才启用签名；否则 release 出未签名包，构建不失败。
    // CI 通过 GitHub Secrets 注入（见 .github/workflows/main.yml 的 Decode signing key）。
    def keystoreFileEnv = System.getenv("KEYSTORE_FILE")
    def keystorePwEnv = System.getenv("KEYSTORE_PASSWORD")
    def keyAliasEnv = System.getenv("KEY_ALIAS")
    def keyPwEnv = System.getenv("KEY_PASSWORD")
    def hasReleaseSigning = keystoreFileEnv != null && keystorePwEnv != null &&
            keyAliasEnv != null && keyPwEnv != null

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreFileEnv)
                storePassword keystorePwEnv
                keyAlias keyAliasEnv
                keyPassword keyPwEnv
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Xposed 模块本身不需要被 shrunk 掉入口
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // libxposed（LSPosed 新版）API 102：编译期 stub，运行期由框架提供。
    // 旧版 de.robv.android.xposed:api:82 已移除 —— 模块入口用 XposedModule（见 MainHook.kt），
    // hook 用 io.github.wxgroup.reborn.xp 下的薄封装（backed by libxposed 102）。
    compileOnly 'io.github.libxposed:api:102.0.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
}
