apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'io.github.wxgroup.reborn'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        // ⚠️ applicationId（应用身份/包名）与 namespace（代码包名）刻意不同：
        //    v1.2.0 起应用身份去掉 reborn → io.github.wxgroup；
        //    代码包名保留 io.github.wxgroup.reborn 不动 —— 改它要动全部源码目录树，
        //    对外毫无收益。applicationId 变更后，分组/设置/签名经 /data/local/tmp
        //    镜像通道在首次启动时自动恢复（见 GroupStore.ensureDefaults/getSettings）。
        applicationId 'io.github.wxgroup'
        minSdk 24
        targetSdk 34
        // 版本号可被 -PversionCodeOverride / -PversionNameOverride 覆盖
        // （CI 里从 tag 推导版本、或本地做灰度包时用得上）
        def vcProp = project.findProperty('versionCodeOverride')
        def vnProp = project.findProperty('versionNameOverride')
        versionCode vcProp == null ? 25 : (vcProp as Integer)
        versionName vnProp == null ? '1.4.0' : vnProp.toString()
    }

    // ── 正式签名（条件启用）──────────────────────────────────────────────
    // 优先读本地 keystore.properties（gitignored，含绝对路径与密码）；
    // 没有就回落到环境变量 KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
    // （CI 通过 GitHub Secrets 注入）。两者都没有时 release 出未签名包，构建不失败。
    def ksProps = new Properties()
    def ksPropFile = rootProject.file("keystore.properties")
    if (ksPropFile.exists()) ksProps.load(ksPropFile.newDataInputStream())

    def ksStoreFile = ksProps.getProperty("storeFile") ?: System.getenv("KEYSTORE_FILE")
    def ksStorePw = ksProps.getProperty("storePassword") ?: System.getenv("KEYSTORE_PASSWORD")
    def ksAlias = ksProps.getProperty("keyAlias") ?: System.getenv("KEY_ALIAS")
    def ksKeyPw = ksProps.getProperty("keyPassword") ?: System.getenv("KEY_PASSWORD")
    def hasReleaseSigning = ksStoreFile != null && ksStorePw != null &&
            ksAlias != null && ksKeyPw != null

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(ksStoreFile)
                storePassword ksStorePw
                keyAlias ksAlias
                keyPassword ksKeyPw
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    // 开启 Compose（AGP 8.x 起不再需要 composeOptions.kotlinCompilerExtensionVersion）
    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Xposed 模块本身不需要被 shrunk 掉入口
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // libxposed（LSPosed 新版）API 102：编译期 stub，运行期由框架提供。
    // 旧版 de.robv.android.xposed:api:82 已移除 —— 模块入口用 XposedModule（见 MainHook.kt），
    // hook 用 io.github.wxgroup.reborn.xp 下的薄封装（backed by libxposed 102）。
    compileOnly 'io.github.libxposed:api:102.0.0'

    // DexKit（LuckyPray/DexKit）：签名适配器类失联时的反查兜底（见 AdaptiveResolve.kt）。
    // 自带 libdexkit.so，LSPosed 会把模块 native lib 目录注入宿主进程。
    implementation 'org.luckypray:dexkit:2.3.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'

    // ══ Jetpack Compose（设置界面重做）══════════════════════════════════
    // BOM 统一版本：material3 / ui / foundation 等不写死版本
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // 线性图标（Material Symbols Rounded 风格）
    // 注意：material-icons-core 只带一小组核心图标，Folder / Palette / PushPin 等都不在里面，
    // 这里必须用 extended（完整图标集），否则编译报 Unresolved reference。
    implementation 'androidx.compose.material:material-icons-extended:1.7.5'
    // Activity / ViewModel / Navigation 的 Compose 桥接
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
